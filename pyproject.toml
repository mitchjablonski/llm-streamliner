[project]
name = "llm-streamliner"
version = "0.1.0"
description = "Capability-stratified structured compression of LLMs: block-replacement surgery + cheap distillation heal, evaluated on reasoning/knowledge as well as surface tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.19",
    "evaluate>=0.4",
    "accelerate>=0.30",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "tqdm>=4.66",
    "tensorboard>=2.15",
    "sentencepiece>=0.2.1",
    "lm-eval>=0.4.12",
    "bitsandbytes>=0.49.2",
]

[project.scripts]
streamliner = "scripts.run_generative:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# Default PyPI torch wheels ship CUDA 12 builds on Linux.
# If you need a specific CUDA build, configure an index here, e.g.:
# [[tool.uv.index]]
# name = "pytorch-cu121"
# url = "https://download.pytorch.org/whl/cu121"
# explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.ruff]
line-length = 100
